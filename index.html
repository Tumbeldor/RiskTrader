<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:title" content="RiskTrader – Börsenspiel">
<meta property="og:description" content="Mach aus 10.000 € Spielgeld mehr, bevor Spreads, Gebühren und Hebel es auffressen. Schaffst du mehr als ich?">

<meta property="og:image:width" content="1200">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316201B'/%3E%3Crect x='6' y='10' width='5' height='11' rx='1' fill='%23FF6A5C'/%3E%3Crect x='13.5' y='13' width='5' height='9' rx='1' fill='%233BCB84'/%3E%3Crect x='21' y='6' width='5' height='12' rx='1' fill='%23EFA23A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: drei Spalten wie ein Handelsplatz — Kursliste | Instrument & Orderticket | Depot, Level & Nachrichten — unter einem Kursband */
:root{
  --bg:#E9ECE6; --surface:#FAFBF8; --surface-2:#F1F3EE; --ink:#16201B; --muted:#5B6760; --line:#D3D8D0; --line-soft:#E4E7E1;
  --accent:#A65F00; --accent-ink:#FFFFFF; --accent-soft:#F5E6CC; --focus:#A65F00;
  --up:#13804A; --down:#C0392C; --up-soft:#DCEFE2; --down-soft:#F6DDD8;
  --r1:#2A8A79; --r2:#5A9636; --r3:#C08F10; --r4:#D2661A; --r5:#C42F28;
  --scrim:rgba(18,26,22,.45);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1211; --surface:#141B19; --surface-2:#1A2320; --ink:#E4EAE6; --muted:#8D9993; --line:#27312E; --line-soft:#1F2826;
    --accent:#EFA23A; --accent-ink:#1B1204; --accent-soft:#34260F; --focus:#EFA23A;
    --up:#3BCB84; --down:#FF6A5C; --up-soft:#12301F; --down-soft:#3A1916;
    --r1:#3CB8A2; --r2:#7CC152; --r3:#E5B630; --r4:#F2843A; --r5:#FF5A4E;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1211; --surface:#141B19; --surface-2:#1A2320; --ink:#E4EAE6; --muted:#8D9993; --line:#27312E; --line-soft:#1F2826;
  --accent:#EFA23A; --accent-ink:#1B1204; --accent-soft:#34260F; --focus:#EFA23A;
  --up:#3BCB84; --down:#FF6A5C; --up-soft:#12301F; --down-soft:#3A1916;
  --r1:#3CB8A2; --r2:#7CC152; --r3:#E5B630; --r4:#F2843A; --r5:#FF5A4E;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
h1,h2,h3,h4{text-wrap:balance}

.app{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---------- Kopfzeile ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{display:block;font:800 21px/1 var(--f-display);letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.clock{display:flex;flex-direction:column;gap:2px;min-width:205px}
.clock .date{font:600 13px var(--f-mono)}
.clock .day{font-size:12px;color:var(--muted)}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.speed button{border:0;background:none;padding:6px 10px;font:600 12px var(--f-mono);color:var(--muted);min-width:38px;display:grid;place-items:center}
.speed button+button{border-left:1px solid var(--line)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.speed svg{width:12px;height:12px;fill:currentColor}
.kpis{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:flex-end;margin-left:auto}
.kpi small{display:block;font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.kpi b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.kpi.main b{font-size:20px}
.kpi.main .chg{font:600 12px var(--f-mono);margin-left:6px}
.hbtns{display:flex;gap:6px;align-items:center}
.lvl-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px}
.lvl-chip .lb{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 12px var(--f-mono)}
.lvl-chip.ready{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ghost{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500}
.ghost:hover{background:var(--surface-2)}

/* ---------- Kursband ---------- */
.tape{overflow:hidden;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;font:500 12px var(--f-mono)}
.tape-in{display:inline-flex;padding-block:6px;animation:tape 90s linear infinite}
.tape span{padding:0 14px;border-right:1px solid var(--line)}
.tape span b{font-weight:600;margin-right:6px}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.tape-in{animation:none}}

/* ---------- Tabs (schmale Bildschirme) ---------- */
.tabs{display:none}

/* ---------- Arbeitsfläche ---------- */
.desk{flex:1;min-height:0;display:grid;grid-template-columns:minmax(270px,310px) minmax(0,1fr) minmax(310px,370px);gap:12px;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;position:sticky;top:0;background:var(--surface);z-index:3;border-bottom:1px solid var(--line)}
.label{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}

/* Kursliste */
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{border:1px solid transparent;background:none;border-radius:6px;padding:3px 8px;font-size:12px;color:var(--muted);font-weight:600}
.filters button[aria-pressed="true"]{border-color:var(--line);background:var(--surface-2);color:var(--ink)}
.ghead{padding:12px 14px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ghead small{color:var(--muted);font-size:11px}
.mrow{display:grid;grid-template-columns:16px minmax(0,1fr) 54px 84px;align-items:center;gap:10px;width:100%;padding:7px 14px;border:0;border-top:1px solid var(--line-soft);background:none;text-align:left}
.mrow:hover{background:var(--surface-2)}
.mrow.sel{background:var(--accent-soft)}
.mrow .nm{min-width:0}
.mrow .nm b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nm small{display:block;color:var(--muted);font:500 11px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow canvas{width:54px;height:24px;display:block}
.mrow .px{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mrow .px b{display:block;font-weight:600;font-size:13px}
.mrow .px small{display:block;font-size:11px}
.mrow.locked .nm,.mrow.locked canvas,.mrow.locked .px{opacity:.45}
.lock{display:inline-flex;align-items:center;gap:3px;font:600 10px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.lock svg{width:9px;height:9px;fill:currentColor}
.held-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}

.risk{display:inline-flex;align-items:flex-end;gap:1.5px;height:14px;vertical-align:-2px}
.risk i{width:2.5px;background:var(--line);border-radius:1px}
.risk i:nth-child(1){height:4px}.risk i:nth-child(2){height:6.5px}.risk i:nth-child(3){height:9px}.risk i:nth-child(4){height:11.5px}.risk i:nth-child(5){height:14px}
.risk.r1 i:nth-child(-n+1){background:var(--r1)}
.risk.r2 i:nth-child(-n+2){background:var(--r2)}
.risk.r3 i:nth-child(-n+3){background:var(--r3)}
.risk.r4 i:nth-child(-n+4){background:var(--r4)}
.risk.r5 i:nth-child(-n+5){background:var(--r5)}

/* Handel */
.trade{padding:16px 18px 22px;display:flex;flex-direction:column;gap:16px}
.ihead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 20px}
.eyebrow{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ihead h2{font:800 clamp(22px,2.6vw,30px)/1.05 var(--f-display);letter-spacing:-.02em;margin:6px 0 4px}
.ihead .sub{font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.iquote{text-align:right}
.iquote .big{display:block;font:600 clamp(22px,2.4vw,28px)/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.iquote .chg{font:600 13px var(--f-mono)}
.chartbox{position:relative}
.ranges{display:flex;gap:2px;margin-bottom:6px}
.ranges button{border:0;background:none;padding:3px 8px;border-radius:5px;font:600 11px var(--f-mono);color:var(--muted)}
.ranges button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
canvas.chart{width:100%;height:260px;display:block;touch-action:pan-y}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.facts div{padding:8px 10px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.facts dt{font-size:11px;color:var(--muted)}
.facts dd{margin:2px 0 0;font:600 13px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.desc{margin:0;color:var(--muted);max-width:68ch}

.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.box h3{margin:0;font:700 16px/1.2 var(--f-display);letter-spacing:-.01em}
.box p{margin:0}
.box .note{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);align-self:flex-start}
.seg button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.seg button:disabled{cursor:not-allowed;opacity:.55}
.seg.wide{display:flex}
.seg.wide button{flex:1;justify-content:center}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.optrow>span{font-size:12px;color:var(--muted);min-width:86px}
.field{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.field input{border:0;background:none;padding:9px 10px;width:100%;min-width:0;font:600 15px var(--f-mono)}
.field input:focus{outline:none}
.field:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.field span{padding:0 10px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font:600 12px var(--f-mono)}
.chips button:hover{background:var(--surface-2)}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;font-size:13px}
.calc dt{color:var(--muted)}
.calc dd{margin:0;text-align:right;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.calc .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600;color:var(--ink)}
.calc .cost{color:var(--down)}
.msg{font-size:12.5px;padding:8px 10px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.msg.warn{background:var(--down-soft);color:var(--down)}
.msg.good{background:var(--up-soft);color:var(--up)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:8px;padding:11px 14px;font-size:14px}
.primary:hover{filter:brightness(1.06)}
.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.primary.sell{background:var(--ink);color:var(--surface)}
.lockbox{border:1px dashed var(--line);border-radius:10px;padding:16px;display:flex;gap:12px;align-items:flex-start;color:var(--muted)}
.lockbox svg{width:18px;height:18px;fill:currentColor;flex:none;margin-top:2px}
.lockbox b{color:var(--ink)}
.prodcard{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.prodcard .pn{font:700 15px/1.25 var(--f-display)}
.prodcard .expl{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font:600 10.5px var(--f-mono);border-radius:4px;padding:1px 5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);vertical-align:1px}
.tag.lev{background:var(--down-soft);color:var(--down);border-color:transparent}
.tag.nolev{background:var(--up-soft);color:var(--up);border-color:transparent}
.guard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center}
.guard label{font-size:12.5px;color:var(--muted)}
.guard .field input{font-size:13px;padding:7px 8px}
.guard .chips{grid-column:2}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Depot */
.dsec{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.eqhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.eqhead b{font:600 18px var(--f-mono)}
canvas.eq{width:100%;height:70px;display:block}
.lvl-top{display:flex;gap:10px;align-items:center}
.lvl-badge{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 16px var(--f-display);flex:none}
.lvl-top b{font:700 16px var(--f-display);display:block}
.lvl-top small{color:var(--muted);font-size:12px}
.req{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px}
.req span{color:var(--muted)}
.req b{font:600 12.5px var(--f-mono)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line-soft)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar i.done{background:var(--up)}
.unl{font-size:12.5px}
.unl ul{margin:4px 0 0;padding-left:18px}
.unl li{margin:1px 0}
.pos{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;padding:9px 14px;border:0;border-top:1px solid var(--line-soft);background:none;text-align:left}
.pos:hover{background:var(--surface-2)}
.pos.sel{background:var(--accent-soft)}
.pos .nm{min-width:0}
.pos .nm b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos .nm small{display:block;font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos .val{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos .val b{display:block;font-size:13px}
.pos .val small{display:block;font-size:11px}
.empty{padding:14px;color:var(--muted);font-size:13px}
.news{list-style:none;margin:0;padding:0}
.news li{padding:9px 14px;border-top:1px solid var(--line-soft);display:grid;grid-template-columns:8px minmax(0,1fr);gap:4px 10px}
.news li::before{content:"";width:8px;height:8px;border-radius:2px;margin-top:5px;background:var(--muted)}
.news li.pos::before{background:var(--up)} .news li.neg::before{background:var(--down)} .news li.me::before{background:var(--accent);border-radius:50%}
.news .nt{font-size:13px}
.news .nd{grid-column:2;font:500 11px var(--f-mono);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.news .nd button{border:0;background:var(--surface-2);border-radius:4px;padding:0 5px;font:600 11px var(--f-mono)}
.news li.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{from{background:var(--accent-soft)}to{background:transparent}}
@media (prefers-reduced-motion: reduce){.news li.fresh{animation:none}}
.costs{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:0;font-size:13px}
.costs dt{color:var(--muted)}
.costs dd{margin:0;text-align:right;font:500 13px var(--f-mono)}
.costs .tot{border-top:1px solid var(--line);padding-top:5px;font-weight:600;color:var(--ink)}
.trades{width:100%;border-collapse:collapse;font-size:12px}
.trades td{padding:5px 0;border-top:1px solid var(--line-soft);vertical-align:top}
.trades td:last-child{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.trades small{color:var(--muted);font-family:var(--f-mono)}

/* Toasts & Dialoge */
#toasts{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(360px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.good{background:var(--up);color:#fff}
.toast.bad{background:var(--down);color:#fff}
.modal-bg{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:600px;width:100%;max-height:100%;overflow:auto;padding:22px 22px 20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:14px}
.modal h2{font:800 26px/1.1 var(--f-display);letter-spacing:-.02em;margin:0}

.modal p{margin:0;max-width:62ch}

.modal li{margin:3px 0}
.modal .kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:14px}
.modal .kv b{font-family:var(--f-mono);text-align:right}

.sharebox{width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2);font:500 13px var(--f-mono);resize:vertical}

.radio input{margin-top:3px;accent-color:var(--accent)}
.radio small{display:block;color:var(--muted)}
.bigstat{font:800 40px/1 var(--f-display);letter-spacing:-.02em}

/* ---------- Mittlere und schmale Bildschirme ---------- */
@media (max-width:1179px){
  html,body,.app{height:auto}
  .tabs{display:flex;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}

  .tabs button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
  .tabs .dot{position:absolute;top:6px;right:calc(50% - 34px);width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .desk{display:block;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  .desk[data-view="market"] #pMarket,.desk[data-view="trade"] #pTrade,.desk[data-view="depot"] #pDepot{display:block}
  .ph{position:static}
  .kpis{margin-left:0;width:100%;justify-content:space-between}
}
@media (max-width:560px){
  .top{gap:10px 14px}
  .clock{min-width:0}
  .hbtns{width:100%;justify-content:space-between}

  .guard{grid-template-columns:1fr}
  .guard .chips{grid-column:1}
}

/* ================= Positionen nach jedem Schritt ================= */
function afterTick() {
  const close = S.tick === TPD - 1;
  for (const ps of [...S.pos]) {
    if (ps.k !== 'd') continue;
    const pr = ps.prod, q = S.q[pr.u];
    if (pr.type === 'tracker' || pr.type === 'faktor') {
      const f = 1 + pr.dir * pr.L * (q.p / pr.ref - 1);
      if (f < .15) { pr.val *= Math.max(f, .002); pr.ref = q.p; }   // Intraday-Reset wie bei echten Faktor-Zertifikaten
      if (close) { const v = pval(pr), fee = v * pr.fee / 252; pr.val = v - fee; pr.ref = q.p; S.st.fin += fee * ps.qty; }
      if (pr.val < .005) { settle(ps, pr.val, 'dead'); continue; }
    } else if (pr.type === 'ko') {
      if ((pr.dir > 0 && q.p <= pr.fl) || (pr.dir < 0 && q.p >= pr.fl)) { settle(ps, 0, 'ko'); continue; }
      if (close) {
        const old = pr.fl;
        pr.fl = pr.dir > 0 ? pr.fl * (1 + KO_LONG / 252) : pr.fl * (1 - KO_SHORT / 252);
        S.st.fin += Math.abs(pr.fl - old) * pr.ratio * ps.qty;
        pr.name = pname(pr);
      }
    }
    if (close && pr.exp != null && S.day >= pr.exp) settle(ps, payoff(pr), 'exp');
  }
  for (const ps of [...S.pos]) {
    if (!ps.sl && !ps.tp) continue;
    const qt = quoteOf(ps);
    if (ps.sl && qt.bid <= ps.sl) sell(ps, 1, 'sl');
    else if (ps.tp && qt.bid >= ps.tp) sell(ps, 1, 'tp');
  }
  if (close) {
    S.eq.push(Math.round(equity() * 100) / 100);
    if (S.eq.length > 1500) S.eq.splice(1, S.eq.length - 1500);
    if (S.mode === 'challenge' && !S.ended && S.day >= CHALLENGE_DAYS - 1) { S.ended = true; S.speed = 0; openModal('end'); }
  }
  if (!S.broke && S.pos.length === 0 && S.cash < MIN_ORDER + ORDER_FEE) { S.broke = true; S.speed = 0; openModal('broke'); }
}

/* ================= Steuern & Ergebnis ================= */
function taxFor(g, dry) {
  if (g <= 0) { if (!dry) S.tax.topf += -g; return 0; }
  let taxable = g;
  const use = Math.min(S.tax.topf, taxable); taxable -= use;
  const free = Math.min(FREIBETRAG - S.tax.frei, taxable); taxable -= free;
  if (!dry) { S.tax.topf -= use; S.tax.frei += free; }
  return Math.max(0, taxable) * TAX_RATE;
}
function realize(name, pnl, costPart, kind) {
  const tax = taxFor(pnl, false);
  const net = pnl - tax;
  S.cash -= tax;
  S.st.tax += tax; S.st.realized += net; S.lv.profit += net;
  S.st.best = Math.max(S.st.best, net); S.st.worst = Math.min(S.st.worst, net);
  const win = costPart >= WIN_MIN_COST && net / costPart >= WIN_MIN;
  if (win) { S.lv.wins++; S.st.wins++; } else if (net < 0) S.st.losses++;
  return {tax, net, win};
}
function logTrade(kind, name, value, pnl) {
  S.trades.unshift({d:S.day, tk:S.tick, date:S.date, kind, name, value, pnl});
  if (S.trades.length > 40) S.trades.length = 40;
}

/* ================= Orders ================= */
function canTrade() {
  if (S.ended) { toast('Die Challenge ist beendet. Starte ein neues Spiel oder spiele frei weiter.', 'bad'); return false; }
  return true;
}
function buy(inst, amount) {
  if (!canTrade()) return false;
  amount = Math.floor(amount * 100) / 100;
  if (!(amount >= MIN_ORDER)) { toast('Die Mindestorder liegt bei 25 €.', 'bad'); return false; }
  if (amount + ORDER_FEE > S.cash + 1e-9) { toast('Nicht genug Bargeld für diese Order inklusive Gebühr.', 'bad'); return false; }
  let pr = null, qt, id, name;
  if (inst.k === 'a') { qt = aquote(inst.id); id = 'a:' + inst.id; name = AM[inst.id].n; }
  else {
    pr = inst.prod;
    if (!pr.code) { pr = issue(pr.type, pr.u, inst.opt); pr.code = genCode(); }
    qt = pquote(pr); id = 'd:' + pr.code; name = pr.name;
  }
  if (!(qt.ask > 0)) { toast('Dieses Produkt ist nicht mehr handelbar.', 'bad'); return false; }
  const qty = amount / qt.ask;
  S.cash -= amount + ORDER_FEE;
  S.st.fees += ORDER_FEE; S.st.spread += qty * (qt.ask - qt.mid); S.st.orders++;
  let ps = S.pos.find(p => p.id === id);
  if (ps) { ps.qty += qty; ps.cost += amount + ORDER_FEE; }
  else {
    ps = {id, k:inst.k, qty, cost:amount + ORDER_FEE, d0:S.day, sl:0, tp:0};
    if (inst.k === 'a') ps.a = inst.id; else ps.prod = pr;
    S.pos.push(ps);
  }
  logTrade('Kauf', name, -(amount + ORDER_FEE), null);
  toast(`Gekauft: ${fqty(qty)} × ${name} für ${feur(amount + ORDER_FEE)}`, 'good');
  save();
  return ps;
}
function sell(ps, frac, reason) {
  if (!reason && !canTrade()) return;
  const qt = quoteOf(ps);
  const all = frac >= .999;
  const qs = all ? ps.qty : ps.qty * frac;
  const gross = qs * qt.bid;
  const fee = Math.min(ORDER_FEE, gross);
  const costPart = ps.cost * (qs / ps.qty);
  const proceeds = gross - fee;
  S.cash += proceeds;
  S.st.fees += fee; S.st.spread += qs * (qt.mid - qt.bid); S.st.orders++;
  const name = ps.k === 'a' ? AM[ps.a].n : ps.prod.name;
  const r = realize(name, proceeds - costPart, costPart);
  if (all) S.pos = S.pos.filter(p => p !== ps); else { ps.qty -= qs; ps.cost -= costPart; }
  const label = reason === 'sl' ? 'Stop-Loss' : reason === 'tp' ? 'Take-Profit' : 'Verkauf';
  logTrade(label, name, proceeds - r.tax, r.net);
  const msg = `${label}: ${name}, Ergebnis ${fsig(r.net)}` + (r.tax > 0 ? ` nach ${feur(r.tax)} Steuern` : '') + (r.win ? ' · Gewinn-Trade' : '');
  if (reason) addNews('me', msg, ps.k === 'a' ? [ps.a] : [ps.prod.u]);
  toast(msg, r.net >= 0 ? 'good' : 'bad');
  save();
}
function settle(ps, unit, why) {

  const r = realize(ps.prod.name, proceeds - ps.cost, ps.cost);
  S.pos = S.pos.filter(p => p !== ps);
  const label = why === 'ko' ? 'Knock-Out' : why === 'dead' ? 'Totalverlust' : 'Fälligkeit';
  logTrade(label, ps.prod.name, proceeds - r.tax, r.net);
  const msg = why === 'ko'
    ? `Knock-Out! ${ps.prod.name} hat die Schwelle berührt und ist wertlos verfallen (${fsig(r.net)}).`
    : why === 'dead' ? `${ps.prod.name} ist durch den Hebel praktisch wertlos geworden und wurde ausgebucht (${fsig(r.net)}).`
    : `${ps.prod.name} ist fällig und wurde mit ${feur(proceeds)} ausgezahlt (${fsig(r.net)}).`;
  addNews('me', msg, [ps.prod.u]);

  g.fillStyle = C.muted;

function prodFacts(pr, qt, forPreview) {
  const s = S.q[pr.u].p, rows = [];
  const lev = levOf(pr);
  rows.push(['Geld / Brief', `${fpx(qt.bid)} / ${fpx(qt.ask)} €`]);
  if (pr.type === 'tracker') {
    rows.push(['Hebel', '1 (ohne Hebel)'], ['Laufende Kosten', fpctU(pr.fee, 1) + ' p.a.'], ['Laufzeit', 'Endlos']);
  } else if (pr.type === 'faktor') {
    rows.push(['Hebel', pr.L + 'x täglich'], ['Laufende Kosten', fpctU(pr.fee, 1) + ' p.a.'], ['Laufzeit', 'Endlos']);
  } else if (pr.type === 'ko') {
    rows.push(['Knock-Out-Schwelle', fpx(pr.fl) + ' €'], ['Abstand zur Schwelle', fpctU(Math.abs(s - pr.fl) / s, 1)], ['Hebel aktuell', nf(1).format(lev) + 'x'],
      ['Finanzierung', fpctU(pr.dir > 0 ? KO_LONG : KO_SHORT, 1) + ' p.a.']);
  } else if (pr.type === 'os') {
    const T = tLeft(pr), iv = ivOf(pr);
    const theta = pr.ratio * (bs(s, pr.K, T, R_F, iv, pr.dir > 0) - bs(s, pr.K, Math.max(0, T - 1 / 252), R_F, iv, pr.dir > 0));
    const be = pr.dir > 0 ? pr.K + qt.ask / pr.ratio : pr.K - qt.ask / pr.ratio;
    rows.push(['Basispreis', fpx(pr.K) + ' €'], ['Fälligkeit', `${fdate(addTD(S.date, pr.exp - S.day))} (${restTage(pr)})`], ['Hebel aktuell', nf(1).format(lev) + 'x'],
      ['Break-even', fpx(be) + ' €'], ['Zeitwertverlust/Tag', qt.mid > 0 ? '≈ ' + fpctU(theta / qt.mid, 2) : '—']);
  } else if (pr.type === 'discount') {
    const disc = 1 - qt.ask / (s * pr.ratio), maxr = pr.cap * pr.ratio / qt.ask - 1;
    rows.push(['Cap', fpx(pr.cap) + ' €'], ['Rabatt auf Basiswert', fpctU(Math.max(0, disc), 1)], ['Max. Rendite', fpct(maxr, 1)],
      ['Fälligkeit', `${fdate(addTD(S.date, pr.exp - S.day))} (${restTage(pr)})`]);
  }
  rows.push(['Bezugsverhältnis', pr.type === 'tracker' || pr.type === 'faktor' ? '—' : RATIO_NF.format(pr.ratio)]);
  return rows;
}
const RATIO_NF = new Intl.NumberFormat('de-DE', {maximumFractionDigits:4});

const RANGE_DAYS = {'1M':21, '3M':63, '6M':126, '1J':252, 'Max':9999};

function chartLines() {

function updateAssetView() {

  // Verkaufen

function updateSellCalc(ps, qt) {

  const qs = ps.qty * f, gross = qs * qt.bid, fee = Math.min(ORDER_FEE, gross), cost = ps.cost * f;
  const pnl = gross - fee - cost, tax = taxFor(pnl, true), net = pnl - tax;
  const win = cost >= WIN_MIN_COST && net / cost >= WIN_MIN;
  setF('sellCalc', rowsHTML([
    ['Stück', fqty(qs)],
    ['Erlös zum Geldkurs', feur(gross)],

    const seen = new Set();

      }
      const qt = quoteOf(ps), val = ps.qty * qt.bid, pnl = val - ps.cost;
      const name = ps.k === 'a' ? AM[ps.a].n : ps.prod.name;
      let sub = fqty(ps.qty) + ' Stk · Ø ' + fpx(ps.cost / ps.qty) + ' €';

      if (r.n.textContent !== name) r.n.textContent = name;
      r.s.textContent = sub; r.v.textContent = feur(val);

  const tl = tradesHTML();
  if (UI.sig.tr !== tl) { document.getElementById('tradeLog').innerHTML = tl; UI.sig.tr = tl; }

function levelCardHTML() {
  const nx = nextLevel(), cur = LEVELS[S.level - 1];
  let h = `<div class="lvl-top"><span class="lvl-badge">L${S.level}</span><div><b>${cur.name}</b><small>${nx ? 'Nächstes Level: L' + (S.level + 1) + ' ' + nx.name : 'Höchstes Level erreicht'}</small></div></div>`;
  if (!nx) return h + `<p class="note">Du hast alle Produkte freigeschaltet. Versuche jetzt, dein Vermögen zu maximieren, ohne von Kosten und Hebeln aufgefressen zu werden.</p>`;
  const w = Math.min(1, S.lv.wins / nx.wins), p = Math.max(0, Math.min(1, S.lv.profit / nx.profit));
  const ready = levelReady();
  const miss = [];
  if (S.lv.wins < nx.wins) miss.push(`${nx.wins - S.lv.wins} Gewinn-Trade${nx.wins - S.lv.wins > 1 ? 's' : ''}`);
  if (S.lv.profit < nx.profit) miss.push(`${feur(nx.profit - S.lv.profit, 0)} Netto-Gewinn`);

  h += `<div class="req"><span>Gewinn-Trades (mind. +1 % netto)</span><b>${S.lv.wins} / ${nx.wins}</b><div class="bar"><i class="${w >= 1 ? 'done' : ''}" style="width:${w * 100}%"></i></div></div>

  return h;

/* ================= Spielschleife ================= */
let timer = null;
function running() { return S.speed > 0 && !S.ended && !S.broke && !UI.modal && !document.hidden; }
function schedule() {
  clearTimeout(timer);
  if (!running()) return;
  const ms = Math.max(50, BASE_MS / S.speed);
  const n = Math.max(1, Math.round(S.speed * ms / BASE_MS));
  timer = setTimeout(() => { tick(n); schedule(); }, ms);
}
let lastSave = 0;
function tick(n) {
  for (let k = 0; k < n; k++) {
    advance(false); afterTick();
    if (!running()) break;
  }
  if (Date.now() - lastSave > 5000) { save(); lastSave = Date.now(); }
  if (UI.sel.t === 'p' && !posById(UI.sel.id)) renderTrade();
  if (S.level !== UI.lastLevel) { UI.lastLevel = S.level; renderMarket(); }
  updateAll();
}
function setSpeed(v) { S.speed = v === 0 || SPEEDS.includes(v) ? v : 1; save(); updateHeader(); schedule(); }
function speedTitle(v) {
  const hour = SEC_PER_HOUR / v, day = BASE_MS * TPD / v / 1000;
  return `${v}×: ${hour >= 1 ? nf(hour % 1 ? 1 : 0).format(hour) + ' Sekunden' : nf(1).format(hour) + ' Sekunden'} = 1 Börsenstunde, ein Handelstag in ${day >= 60 ? nf(1).format(day / 60) + ' Minuten' : nf(day >= 10 ? 0 : 1).format(day) + ' Sekunden'}`;
}

}

    <h2>Dein Depot ist leer.</h2>
    <p>Kein Bargeld mehr für eine Order, keine Positionen. Kosten, Hebel und Pech haben gewonnen. Neues Spiel, neues Glück.</p>
    <div class="acts"><button type="button" class="primary" data-act="new">Neues Spiel</button></div>`,
};

/* ================= Ereignisse ================= */
function select(sel) {
  UI.sel = sel; UI.hover = null; UI.sellFrac = 1;
  if (sel.t === 'p') { const ps = posById(sel.id); if (ps) UI.sel.u = ps.prod.u; }
  renderTrade(); updateMarket(); updateDepot();
  setView('trade');
  if (window.matchMedia('(max-width:1179px)').matches) window.scrollTo({top:0});
}
function setView(v) {
  UI.view = v;
  document.getElementById('desk').dataset.view = v;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  requestAnimationFrame(() => { drawMain(); drawEq(); for (const id in UI.rows) spark(UI.rows[id].cv, S.q[id].i.slice(-TPD)); });
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.sel) { select({t:'a', id:d.sel}); if (!UI.modal) return; closeModal(); return; }
  if (d.pid) { select({t:'p', id:d.pid}); return; }
  if (d.speed != null) { setSpeed(Number(d.speed)); return; }
  if (d.view) { setView(d.view); return; }
  if (d.filter) { UI.filter = d.filter; renderMarket(); return; }
  if (d.range) { UI.range = d.range; document.querySelectorAll('[data-range]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); drawMain(); return; }
  if (d.side) { UI.side = d.side; renderTrade(); return; }
  if (d.pct) { const a = Math.max(0, Math.floor((S.cash - ORDER_FEE) * Number(d.pct) * 100) / 100); UI.amt = a > 0 ? String(a) : ''; document.getElementById('amt').value = UI.amt; updateTrade(); return; }
  if (d.dpct) { const a = Math.max(0, Math.floor((S.cash - ORDER_FEE) * Number(d.dpct) * 100) / 100); UI.damt = a > 0 ? String(a) : ''; document.getElementById('damt').value = UI.damt; updateTrade(); return; }
  if (d.frac) { UI.sellFrac = Number(d.frac); document.querySelectorAll('[data-frac]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); updateTrade(); return; }
  if (d.btype) { UI.b.type = d.btype; if (d.btype === 'discount') UI.b.dir = 1; renderTrade(); return; }
  if (d.bopt) { UI.b[d.bopt] = Number(d.v); document.getElementById('bOpts').innerHTML = builderOptsHTML(); updateTrade(); return; }
  if (d.slq || d.tpq) {
    const ps = currentPos(); if (!ps) return;
    const bid = quoteOf(ps).bid;
    if (d.slq) document.getElementById('slIn').value = +(bid * (1 + Number(d.slq))).toPrecision(5);
    else document.getElementById('tpIn').value = +(bid * (1 + Number(d.tpq))).toPrecision(5);
    return;
  }
  if (d.act) { modalAct(d.act); return; }
  switch (t.id) {
    case 'doBuy': { if (buy({k:'a', id:UI.sel.id}, parseFloat(UI.amt) || 0)) { UI.amt = ''; renderTrade(); updateAll(); } return; }
    case 'doSell': { const ps = currentPos(); if (ps) { sell(ps, UI.sellFrac); renderTrade(); updateAll(); } return; }
    case 'doDBuy': {
      const opt = builderOpt();
      const ps = buy({k:'d', prod:{type:UI.b.type, u:UI.sel.id, code:''}, opt}, parseFloat(UI.damt) || 0);
      if (ps) { UI.damt = ''; select({t:'p', id:ps.id}); updateAll(); }
      return;
    }
    case 'doRebuy': { const ps = currentPos(); if (ps && buy({k:'d', prod:ps.prod}, parseFloat(UI.ramt) || 0)) { UI.ramt = ''; document.getElementById('ramt').value = ''; updateAll(); } return; }
    case 'guardSet': {
      const ps = currentPos(); if (!ps) return;
      const bid = quoteOf(ps).bid;
      const sl = parseFloat(document.getElementById('slIn').value) || 0, tp = parseFloat(document.getElementById('tpIn').value) || 0;
      if (sl && sl >= bid) { toast('Der Stop-Loss muss unter dem aktuellen Geldkurs liegen.', 'bad'); return; }
      if (tp && tp <= bid) { toast('Der Take-Profit muss über dem aktuellen Geldkurs liegen.', 'bad'); return; }
      ps.sl = sl; ps.tp = tp; save(); toast(sl || tp ? 'Automatischer Verkauf gespeichert.' : 'Keine Marken gesetzt.', 'good'); updateAll();
      return;
    }
    case 'guardClear': { const ps = currentPos(); if (!ps) return; ps.sl = 0; ps.tp = 0; save(); renderTrade(); updateAll(); toast('Automatischer Verkauf entfernt.'); return; }
    case 'doLvl': doLevelUp(); return;
    case 'lvlChip': setView('depot'); document.getElementById('lvlCard').scrollIntoView({block:'nearest', behavior:'smooth'}); return;
    case 'bHelp': openModal('help'); return;
    case 'bShare': openModal('share'); return;
    case 'bNew': openModal('newgame'); return;
  }
});
function currentPos() { return UI.sel.t === 'a' ? assetPos(UI.sel.id) : posById(UI.sel.id); }
function modalAct(a) {
  if (a === 'close') { closeModal(); return; }
  if (a === 'new') { UI.modal = null; openModal('newgame'); return; }
  if (a === 'cont') { S.mode = 'frei'; S.ended = false; S.speed = 1; save(); closeModal(); updateAll(); return; }
  if (a === 'start') {
    const seed = document.getElementById('ngSeed').value;
    const mode = document.getElementById('ngCh').checked ? 'challenge' : 'frei';
    newGame({seed, mode, seen:true});
    UI.lastLevel = S.level;
    document.getElementById('news').innerHTML = ''; UI.prows = {}; document.getElementById('plist').innerHTML = ''; UI.sig = {};
    save(); renderMarket(); renderTrade(); closeModal(); updateAll();
    toast(`Neues Spiel gestartet · Seed ${S.seed}`, 'good');
    return;
  }
  if (a === 'copy') {
    const ta = document.getElementById('shareText'); const txt = ta.value;
    const fallback = () => { ta.focus(); ta.select(); toast('Text markiert. Kopiere ihn mit Strg+C bzw. Cmd+C.'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Kopiert. Jetzt an Freunde schicken.', 'good'), fallback); } catch (e) { fallback(); }
  }
}
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'amt') { UI.amt = e.target.value; updateTrade(); }
  else if (id === 'damt') { UI.damt = e.target.value; updateTrade(); }
  else if (id === 'ramt') { UI.ramt = e.target.value; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.modal && UI.modal !== 'broke' && UI.modal !== 'end') { closeModal(); return; }
  if (e.code === 'Space' && !UI.modal && !e.target.closest('input,textarea,button,select')) {
    e.preventDefault();
    if (S.speed > 0) { UI.lastSpeed = S.speed; setSpeed(0); } else setSpeed(UI.lastSpeed || 1);
  }
});
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal' && (UI.modal === 'help' || UI.modal === 'share' || UI.modal === 'level')) closeModal(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); schedule(); });
window.addEventListener('pagehide', save);
let rT = null;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { drawMain(); drawEq(); updateMarket(); }, 80); });
const mq = window.matchMedia('(prefers-color-scheme: dark)');
const recolor = () => { readColors(); drawMain(); drawEq(); updateMarket(); };
if (mq.addEventListener) mq.addEventListener('change', recolor);
new MutationObserver(recolor).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

/* ================= Start ================= */
function start(data) {
  readColors();
  const restored = data && valid(data.state) ? data.state : load();
  if (restored) { S = restored; S.broke = S.broke && S.pos.length === 0 && S.cash < MIN_ORDER + ORDER_FEE; }
  else newGame({seed:'', mode:'frei'});
  UI.lastLevel = S.level;
  document.querySelectorAll('[data-speed]').forEach(b => { const v = Number(b.dataset.speed); b.title = v ? speedTitle(v) : 'Pause (Leertaste)'; });
  buildTape(); renderMarket(); renderTrade(); setView(window.matchMedia('(max-width:1179px)').matches ? 'market' : 'trade'); updateAll();
  if (!S.seen) openModal('intro');
  else if (S.ended) openModal('end');
  else if (S.broke) openModal('broke');
  else { if (restored) toast(`Willkommen zurück · Tag ${S.day}`); schedule(); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawMain(); drawEq(); });
}
try { window.claude?.hot?.snapshot?.(() => ({state:S})); } catch (e) { /* außerhalb des Viewers nicht vorhanden */ }
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
